name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  offline-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on external scripts, stylesheets or images
        run: |
          if grep -nE '<(script|link|img)[^>]+(src|href)="(https?:)?//' whispr-web/*.html; then
            echo "External resource found. Whispr must work offline."
            exit 1
          fi
